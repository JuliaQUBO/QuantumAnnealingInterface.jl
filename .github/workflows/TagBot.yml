name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@14d7645453716d7a2f09b1da0504a024f97462a1 # v1.25.10
        with:
          # The default GITHUB_TOKEN is sufficient for standard General registry
          # registrations. Add TagBot's `ssh` input only if tags must trigger
          # downstream workflows such as documentation builds.
          token: ${{ secrets.GITHUB_TOKEN }}
